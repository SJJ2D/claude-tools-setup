<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>مسرح الفريج — ملف الطباعة</title>
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}
html,body{margin:0;font-family:'Almarai',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:297mm;height:210mm;position:relative;overflow:hidden;page-break-after:always;background:#fff}
.page:last-child{page-break-after:auto}
.scene svg{position:absolute;inset:0;width:297mm;height:210mm}
.grid{position:absolute;inset:10mm;display:grid;gap:6mm}
.cut{border:1.2px dashed #b9b2a6}
.card{border-radius:6mm;position:relative;overflow:hidden;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
.rid-head{color:#fff;padding:4mm 6mm;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:8mm}
.rid-head small{font-size:4.6mm;font-weight:700;opacity:.95}
.clues{padding:2mm 6mm;display:flex;flex-direction:column;gap:1.8mm;flex:1;justify-content:center}
.clue{display:flex;gap:3mm;align-items:flex-start;font-size:5.2mm;line-height:1.45;font-weight:700;color:#2b1d14}
.num{flex:0 0 9mm;height:9mm;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:4.6mm}
.pts{font-size:3.4mm;font-weight:700;color:#7a6a58;margin-top:.6mm;display:block}
.ask{text-align:center;font-weight:800;font-size:6mm;padding:0 0 4mm}
.back{align-items:center;justify-content:center;gap:3mm}
.back svg{width:62mm;height:52mm}
.back .lbl{font-weight:800;font-size:5mm;color:#fff;padding:1.6mm 6mm;border-radius:10mm}
.time{align-items:center;justify-content:center;text-align:center;border:2.4mm solid #8a5a35;background:#FFF8EA}
.time b{font-size:9.5mm;color:#5a3518;line-height:1.35}
.time i{font-style:normal;font-size:16mm;line-height:1}
.guide{padding:12mm 16mm;color:#2b1d14}
.guide h1{font-size:11mm;color:#8a3b14;margin-bottom:4mm}
.guide table{border-collapse:collapse;width:100%;font-size:4.3mm;margin-top:3mm}
.guide td,.guide th{border:1px solid #d8cdbb;padding:2.2mm 3mm;text-align:right;vertical-align:top}
.guide th{background:#f3e6cf}
.note{margin-top:4mm;font-size:4mm;line-height:1.7;background:#fff4e0;border-radius:3mm;padding:3mm 5mm}
.sign{position:absolute;inset:18mm 14mm;border-radius:14mm;background:#8a3b14;display:flex;align-items:center;justify-content:center}
.sign div{position:absolute;inset:7mm;border-radius:10mm;background:#FFF3D6;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8a3b14;font-size:33mm;white-space:nowrap}
.crank{position:absolute;left:14mm;right:14mm;bottom:12mm;height:34mm;border-radius:8mm;background:#FFF3D6;border:2mm solid #8a3b14;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8a3b14;font-size:15mm}
</style></head><body>
<div id="root"></div>
<script>
const OUT='#2b1d14', SW=3.2;
const R=document.getElementById('root');
const page=(cls,html)=>{const d=document.createElement('div');d.className='page '+(cls||'');d.innerHTML=html;R.appendChild(d);return d;};

// ───────── cartoon parts ─────────
function face(cx,cy,r,o={}){
  const e=r*.33, ey=cy-r*.05;
  let s=`<ellipse cx="${cx-e}" cy="${ey}" rx="${r*.1}" ry="${r*.14}" fill="${OUT}"/><ellipse cx="${cx+e}" cy="${ey}" rx="${r*.1}" ry="${r*.14}" fill="${OUT}"/>
  <circle cx="${cx-e+r*.035}" cy="${ey-r*.05}" r="${r*.035}" fill="#fff"/><circle cx="${cx+e+r*.035}" cy="${ey-r*.05}" r="${r*.035}" fill="#fff"/>
  <ellipse cx="${cx-r*.55}" cy="${cy+r*.25}" rx="${r*.16}" ry="${r*.1}" fill="#F28B82" opacity=".55"/><ellipse cx="${cx+r*.55}" cy="${cy+r*.25}" rx="${r*.16}" ry="${r*.1}" fill="#F28B82" opacity=".55"/>`;
  if(o.sleepy) s=`<path d="M${cx-e-r*.13} ${ey} q${r*.13} ${r*.1} ${r*.26} 0 M${cx+e-r*.13} ${ey} q${r*.13} ${r*.1} ${r*.26} 0" stroke="${OUT}" stroke-width="${SW}" fill="none" stroke-linecap="round"/>`+s.split('\n')[1].replace(/<circle[^>]*>/g,'');
  s+= o.open? `<path d="M${cx-r*.22} ${cy+r*.28} q${r*.22} ${r*.34} ${r*.44} 0 z" fill="#8b2b2b" stroke="${OUT}" stroke-width="${SW*.7}" stroke-linejoin="round"/>`
            : `<path d="M${cx-r*.22} ${cy+r*.3} q${r*.22} ${r*.22} ${r*.44} 0" stroke="${OUT}" stroke-width="${SW*.9}" fill="none" stroke-linecap="round"/>`;
  return s;
}
const skin=['#F2C9A0','#E0AC80','#C98E62'];
function kid(x,y,s,o){ // feet at (x,y), height ≈ 230*s
  const g=o.girl, c=o.color, k=o.skin||skin[0], hy=y-170*s, hr=52*s;
  let a=`<g>`;
  a+=`<ellipse cx="${x}" cy="${y+4*s}" rx="${50*s}" ry="${10*s}" fill="#000" opacity=".15"/>`;
  // legs
  a+=`<rect x="${x-22*s}" y="${y-28*s}" width="${16*s}" height="${28*s}" rx="${6*s}" fill="${k}" stroke="${OUT}" stroke-width="${SW}"/><rect x="${x+6*s}" y="${y-28*s}" width="${16*s}" height="${28*s}" rx="${6*s}" fill="${k}" stroke="${OUT}" stroke-width="${SW}"/>`;
  // robe
  a+=`<path d="M${x-30*s} ${y-120*s} L${x+30*s} ${y-120*s} L${x+46*s} ${y-22*s} Q${x} ${y-12*s} ${x-46*s} ${y-22*s} Z" fill="${c}" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>`;
  if(g) for(let i=0;i<5;i++) a+=`<circle cx="${x-30*s+i*15*s}" cy="${y-30*s}" r="${3.5*s}" fill="#FFD54A"/>`;
  else a+=`<path d="M${x} ${y-118*s} v${40*s}" stroke="${OUT}" stroke-width="${SW*.6}" opacity=".35"/>`;
  // arms
  const arm=(sx,ex,ey)=>`<path d="M${x+sx*s} ${y-108*s} Q${x+(sx+ex)/2*s} ${y-(108+ey)/2*s-10*s} ${x+ex*s} ${y-ey*s}" stroke="${c}" stroke-width="${18*s}" fill="none" stroke-linecap="round"/><path d="M${x+sx*s} ${y-108*s} Q${x+(sx+ex)/2*s} ${y-(108+ey)/2*s-10*s} ${x+ex*s} ${y-ey*s}" stroke="${OUT}" stroke-width="${18*s+SW*2}" fill="none" stroke-linecap="round" opacity="0"/><circle cx="${x+ex*s}" cy="${y-ey*s}" r="${10*s}" fill="${k}" stroke="${OUT}" stroke-width="${SW}"/>`;
  const L=o.armL||[-58,70], Rr=o.armR||[58,70];
  a+=arm(-24,L[0],L[1])+arm(24,Rr[0],Rr[1]);
  // head
  if(g){ a+=`<path d="M${x-hr*1.15} ${hy+hr*.2} Q${x-hr*1.25} ${hy-hr*1.35} ${x} ${hy-hr*1.3} Q${x+hr*1.25} ${hy-hr*1.35} ${x+hr*1.15} ${hy+hr*.2} L${x+hr*1.05} ${hy+hr*1.45} Q${x} ${hy+hr*1.75} ${x-hr*1.05} ${hy+hr*1.45} Z" fill="${o.scarf||'#7B3FA0'}" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>`;
    for(let i=0;i<9;i++){const t=i/8*Math.PI;a+=`<circle cx="${x-Math.cos(t)*hr*1.05}" cy="${hy-Math.sin(t)*hr*1.15+hr*.15}" r="${3.4*s}" fill="#FFD54A"/>`;} }
  a+=`<circle cx="${x}" cy="${hy}" r="${hr}" fill="${k}" stroke="${OUT}" stroke-width="${SW}"/>`;
  if(!g) a+=`<path d="M${x-hr*.95} ${hy-hr*.35} Q${x} ${hy-hr*1.45} ${x+hr*.95} ${hy-hr*.35} Z" fill="${o.cap||'#fff'}" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>`+[...Array(4)].map((_,i)=>`<circle cx="${x-hr*.5+i*hr*.33}" cy="${hy-hr*.62}" r="${2.6*s}" fill="#C9A227"/>`).join('');
  a+=face(x,hy+hr*.08,hr*.9,o);
  if(o.extra) a+=o.extra;
  return a+`</g>`;
}
function bag(x,y,s,c){return `<path d="M${x-8*s} ${y-22*s} q8 -10 16 0" stroke="${OUT}" stroke-width="${SW}" fill="none"/><path d="M${x-26*s} ${y-18*s} Q${x-34*s} ${y+30*s} ${x} ${y+34*s} Q${x+34*s} ${y+30*s} ${x+26*s} ${y-18*s} Z" fill="${c}" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>`+
  ['#fff','#FF5DA2','#FFD54A','#5BC0EB'].map((cc,i)=>`<circle cx="${x-15*s+i*10*s}" cy="${y-20*s-(i%2)*6*s}" r="${6*s}" fill="${cc}" stroke="${OUT}" stroke-width="${SW*.6}"/>`).join('')+
  `<path d="M${x-26*s} ${y-2*s} h${52*s}" stroke="#fff" stroke-width="${3*s}" opacity=".7" stroke-dasharray="${5*s} ${5*s}"/>`;}
function house(x,y,w,h,o={}){ // bottom-left at (x,y)
  const c=o.color||'#E9C48C', sh=o.shade||'#D3A86B'; let a='';
  a+=`<rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="${c}" stroke="${OUT}" stroke-width="${SW}"/>`;
  a+=`<rect x="${x+w-w*.18}" y="${y-h}" width="${w*.18}" height="${h}" fill="${sh}" opacity=".55"/>`;
  for(let i=0;i<Math.floor(w/42);i++) a+=`<path d="M${x+8+i*42} ${y-h} v-16 h24 v16" fill="${c}" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>`;
  a+=`<rect x="${x-4}" y="${y-h+12}" width="${w+8}" height="10" fill="${sh}" stroke="${OUT}" stroke-width="${SW*.8}"/>`;
  if(o.barjeel){const bx=x+w*.15,bw=w*.38,bh=h*.6;a+=`<rect x="${bx}" y="${y-h-bh}" width="${bw}" height="${bh}" fill="${c}" stroke="${OUT}" stroke-width="${SW}"/>`;for(let i=1;i<4;i++)a+=`<rect x="${bx+i*bw/4-5}" y="${y-h-bh+12}" width="10" height="${bh*.6}" rx="4" fill="${sh}" stroke="${OUT}" stroke-width="${SW*.6}"/>`;a+=`<rect x="${bx-6}" y="${y-h-bh-8}" width="${bw+12}" height="12" fill="${sh}" stroke="${OUT}" stroke-width="${SW*.8}"/>`;}
  const win=o.lit?'#FFD966':'#5A3A22';
  (o.wins||[[.18,.42],[.62,.42]]).forEach(([fx,fy])=>{a+=`<path d="M${x+w*fx} ${y-h+h*fy+40} v-30 a17 17 0 0 1 34 0 v30 z" fill="${win}" stroke="${OUT}" stroke-width="${SW}"/>`;if(o.lit)a+=`<path d="M${x+w*fx+17} ${y-h+h*fy-6} v46 M${x+w*fx} ${y-h+h*fy+18} h34" stroke="${OUT}" stroke-width="${SW*.6}"/>`;});
  if(o.door!==false){const dx=x+w*(o.doorX||.36),dw=Math.min(70,w*.32),dh=h*.46;a+=`<path d="M${dx} ${y} v-${dh-20} a${dw/2} 20 0 0 1 ${dw} 0 v${dh-20} z" fill="${o.doorColor||'#9B5A2A'}" stroke="${OUT}" stroke-width="${SW}"/><path d="M${dx+dw/2} ${y} v-${dh-6}" stroke="${OUT}" stroke-width="${SW*.7}"/>`;for(let i=0;i<3;i++)for(let j=0;j<2;j++)a+=`<circle cx="${dx+dw*(.25+j*.5)}" cy="${y-dh*.25-i*dh*.22}" r="3" fill="#F4C542"/>`;}
  return a;}
function palm(x,y,s){let a=`<path d="M${x} ${y} Q${x+18*s} ${y-90*s} ${x+6*s} ${y-190*s}" stroke="${OUT}" stroke-width="${26*s+SW*2}" fill="none" stroke-linecap="round"/><path d="M${x} ${y} Q${x+18*s} ${y-90*s} ${x+6*s} ${y-190*s}" stroke="#A0703F" stroke-width="${26*s}" fill="none" stroke-linecap="round"/>`;
  for(let i=0;i<7;i++)a+=`<path d="M${x+(6+i*0)*s} ${y-(182+i*0)*s} q${0} 0 0 0" />`;
  a+=`<path d="M${x+6*s} ${y-188*s} q${10*s} ${-40*s} ${0} ${-46*s}" stroke="#7A4F28" stroke-width="${6*s}" fill="none"/>`;
  [[-1,0.3],[-1,-.3],[1,0.3],[1,-.3],[-.4,-1],[.4,-1],[0,-1.1]].forEach(([dx,dy])=>{const ex=x+6*s+dx*110*s, ey=y-190*s+dy*40*s+40*s*(Math.abs(dx)>.5?1:0);a+=`<path d="M${x+6*s} ${y-190*s} Q${x+6*s+dx*60*s} ${y-190*s+dy*80*s-30*s} ${ex} ${ey} Q${x+6*s+dx*50*s} ${y-190*s+dy*40*s} ${x+6*s} ${y-190*s} Z" fill="#3FAE49" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>`;});
  a+=[0,1,2].map(i=>`<circle cx="${x+(-6+i*12)*s}" cy="${y-176*s}" r="${8*s}" fill="#C2571A" stroke="${OUT}" stroke-width="${SW*.6}"/>`).join('');return a;}
const stars=(n,h,seed)=>{let a='',r=seed;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};for(let i=0;i<n;i++){const x=rnd()*1200,y=rnd()*h,s=1.5+rnd()*3;a+=`<path d="M${x} ${y-s*2}L${x+s*.6} ${y-s*.6}L${x+s*2} ${y}L${x+s*.6} ${y+s*.6}L${x} ${y+s*2}L${x-s*.6} ${y+s*.6}L${x-s*2} ${y}L${x-s*.6} ${y-s*.6}Z" fill="#FFF6C8" opacity="${.6+rnd()*.4}"/>`;}return a;};
const banner=(t,c)=>`<g><rect x="400" y="716" width="400" height="66" rx="33" fill="${c}" stroke="${OUT}" stroke-width="${SW}"/><text x="600" y="762" text-anchor="middle" font-family="Almarai" font-weight="800" font-size="38" fill="#fff">${t}</text></g>`;
const svg=(inner,defs='')=>`<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${inner}</svg>`;
const bunting=(y,cols)=>{let a=`<path d="M-10 ${y} Q600 ${y+60} 1210 ${y}" stroke="${OUT}" stroke-width="2.5" fill="none"/>`;for(let i=0;i<16;i++){const x=20+i*76, yy=y+Math.sin(i/15*Math.PI)*28+ (x>0?0:0);a+=`<path d="M${x} ${yy} l34 0 l-17 34 z" fill="${cols[i%cols.length]}" stroke="${OUT}" stroke-width="2"/>`;}return a;};

// ───────── Scene 1: القرقاعون ─────────
const s1=svg(`
<rect width="1200" height="800" fill="url(#n1)"/>${stars(70,380,7)}
<circle cx="980" cy="120" r="70" fill="#FFF3B0"/><circle cx="980" cy="120" r="95" fill="#FFF3B0" opacity=".18"/>
<circle cx="958" cy="104" r="10" fill="#EADB8E"/><circle cx="1000" cy="140" r="14" fill="#EADB8E"/>
${house(-20,620,300,330,{lit:true,barjeel:true,doorX:.5})}
${house(270,620,300,290,{lit:true,color:'#F0CF9A',door:true,doorX:.34,doorColor:'#2E8B8B'})}
${house(860,620,360,310,{lit:true,color:'#E6BC80',doorX:.2})}
<path d="M-10 230 Q300 300 600 250 T1210 240" stroke="${OUT}" stroke-width="2.5" fill="none"/>
${[...Array(11)].map((_,i)=>{const x=60+i*110,y=258+Math.sin(i*.9)*18;const c=['#FF5DA2','#FFD54A','#3FAE49','#5BC0EB','#FF8A3D'][i%5];return `<path d="M${x} ${y-14} v14" stroke="${OUT}" stroke-width="2"/><ellipse cx="${x}" cy="${y+18}" rx="16" ry="22" fill="${c}" stroke="${OUT}" stroke-width="2.5"/><circle cx="${x}" cy="${y+18}" r="30" fill="${c}" opacity=".18"/>`}).join('')}
<rect x="0" y="610" width="1200" height="190" fill="#EBC889"/><rect x="0" y="610" width="1200" height="14" fill="#D9B06A"/>
<path d="M0 700 Q600 660 1200 700 V800 H0Z" fill="#E2BC79"/>
<!-- grandma at teal door with basket -->
${(()=>{const x=420,y=620;return `<path d="M${x-40} ${y} L${x-30} ${y-150} Q${x} ${y-175} ${x+30} ${y-150} L${x+40} ${y} Z" fill="#2B2B3A" stroke="${OUT}" stroke-width="${SW}"/><circle cx="${x}" cy="${y-175}" r="34" fill="#2B2B3A" stroke="${OUT}" stroke-width="${SW}"/><circle cx="${x}" cy="${y-170}" r="24" fill="${skin[1]}" stroke="${OUT}" stroke-width="${SW*.8}"/>${face(x,y-168,22,{})}<path d="M${x+20} ${y-100} q40 0 52 -10" stroke="#2B2B3A" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M${x+40} ${y-110} h70 l-10 34 h-50 z" fill="#C98B3C" stroke="${OUT}" stroke-width="${SW}"/>${['#FF5DA2','#FFD54A','#fff','#5BC0EB','#3FAE49'].map((c,i)=>`<circle cx="${x+50+i*13}" cy="${y-114-(i%2)*6}" r="7" fill="${c}" stroke="${OUT}" stroke-width="1.6"/>`).join('')}`})()}
${kid(600,700,1.05,{color:'#3FAE49',armL:[-62,70],armR:[64,108],extra:bag(675,600,1.0,'#FFD54A')})}
${kid(790,705,1.0,{girl:true,color:'#FF5DA2',scarf:'#6A2C91',armL:[-68,118],armR:[60,70],extra:bag(715,590,.95,'#5BC0EB')})}
${kid(980,700,1.1,{color:'#5BC0EB',cap:'#fff',open:true,armL:[-60,180],armR:[60,180]})}
${['#FF5DA2','#FFD54A','#fff','#3FAE49'].map((c,i)=>`<circle cx="${940+i*30}" cy="${400-i%2*30}" r="9" fill="${c}" stroke="${OUT}" stroke-width="2"/>`).join('')}
<g font-family="Almarai" font-weight="800"><path d="M1000 400 q0 -50 60 -50 h40 q50 0 50 50 q0 50 -50 50 h-50 l-30 30 l6 -32 q-26 -10 -26 -48z" fill="#fff" stroke="${OUT}" stroke-width="${SW}"/><text x="1072" y="414" text-anchor="middle" font-size="34" fill="#C2185B">قرقاعون!</text></g>
${banner('القرقاعون','#E8467C')}`,
`<linearGradient id="n1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1F5E"/><stop offset=".6" stroke-color="#4B3A9C" stop-color="#4B3A9C"/><stop offset="1" stop-color="#C77DBA"/></linearGradient>`);

// ───────── Scene 2: المسحّر ─────────
const s2=svg(`
<rect width="1200" height="800" fill="url(#n2)"/>${stars(110,520,21)}
<path d="M200 130 a62 62 0 1 0 50 98 a50 50 0 1 1 -50 -98z" fill="#FFF3B0"/>
${house(-30,620,330,320,{barjeel:true,wins:[[.18,.4],[.62,.4]],doorX:.42,color:'#C7A06A',shade:'#A9844F'})}
${house(300,620,280,280,{color:'#CFA874',shade:'#A9844F',wins:[[.15,.38],[.6,.38]],lit:false,doorX:.36})}
${house(870,620,350,330,{color:'#C49A62',shade:'#A9844F',barjeel:false,wins:[[.18,.38],[.62,.38]],doorX:.2})}
<!-- one lit window with peeking sleepy kid -->
<path d="M343 452 v-30 a17 17 0 0 1 34 0 v30 z" fill="#FFD966" stroke="${OUT}" stroke-width="${SW}"/>
<circle cx="360" cy="440" r="13" fill="${skin[0]}" stroke="${OUT}" stroke-width="2"/><path d="M353 438 h5 M362 438 h5" stroke="${OUT}" stroke-width="2"/>
<rect x="0" y="610" width="1200" height="190" fill="#8E7A5E"/><path d="M0 700 Q600 660 1200 700 V800 H0Z" fill="#7F6B50"/>
<!-- cat -->
<g transform="translate(250,612)"><ellipse cx="0" cy="-22" rx="34" ry="22" fill="#F0A04B" stroke="${OUT}" stroke-width="${SW}"/><circle cx="-30" cy="-44" r="18" fill="#F0A04B" stroke="${OUT}" stroke-width="${SW}"/><path d="M-44 -56 l4 -16 l10 10 M-26 -60 l6 -14 l6 14" fill="#F0A04B" stroke="${OUT}" stroke-width="2.5"/><path d="M-36 -46 h4 M-26 -46 h4" stroke="${OUT}" stroke-width="2.5"/><path d="M32 -24 q30 -10 20 -40" stroke="${OUT}" stroke-width="8" fill="none" stroke-linecap="round"/></g>
<!-- musahhar -->
${(()=>{const x=640,y=700,k=skin[1];return `<ellipse cx="${x}" cy="${y+6}" rx="90" ry="14" fill="#000" opacity=".2"/>
<rect x="${x-34}" y="${y-36}" width="22" height="36" rx="8" fill="${k}" stroke="${OUT}" stroke-width="${SW}"/><rect x="${x+12}" y="${y-36}" width="22" height="36" rx="8" fill="${k}" stroke="${OUT}" stroke-width="${SW}"/>
<path d="M${x-50} ${y-250} L${x+50} ${y-250} L${x+70} ${y-30} Q${x} ${y-16} ${x-70} ${y-30} Z" fill="#F7F3E8" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>
<path d="M${x-50} ${y-250} L${x-80} ${y-40} Q${x-60} ${y-30} ${x-56} ${y-40} L${x-40} ${y-200}" fill="#7A4A2A" stroke="${OUT}" stroke-width="${SW}" opacity=".9"/>
<path d="M${x+40} ${y-230} Q${x+110} ${y-260} ${x+120} ${y-330}" stroke="#F7F3E8" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M${x+40} ${y-230} Q${x+110} ${y-260} ${x+120} ${y-330}" stroke="${OUT}" stroke-width="${SW}" fill="none" opacity=".0"/>
