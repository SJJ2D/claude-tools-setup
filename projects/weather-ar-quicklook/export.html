<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { USDZExporter } from '/three/jsm/exporters/USDZExporter.js';
window.exportUSDZ = async (json) => {
  const obj = new THREE.ObjectLoader().parse(JSON.parse(json));
  // ObjectLoader restores images asynchronously: wait until every texture image is decoded
  const imgs = []; obj.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { if (m.map && m.map.image) imgs.push(m.map.image); }); });
  await Promise.all(imgs.map(im => im.decode ? im.decode().catch(() => {}) : 0));
  const sc = new THREE.Scene(); sc.add(obj);
  const ab = await new USDZExporter().parseAsync(sc, { quickLookCompatible: true, maxTextureSize: 1024,
    ar: { anchoring: { type: 'plane' }, planeAnchoring: { alignment: 'horizontal' } } });
  let bin = ''; const u = new Uint8Array(ab); for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(bin);
};
window.ready = true;
</script></body></html>
