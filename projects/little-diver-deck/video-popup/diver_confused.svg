  <path d="M74 152 C96 160 120 154 128 136 C134 116 136 80 140 46" stroke="#FFC83A" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M134 50 L146 42" stroke="#F2683F" stroke-width="16" stroke-linecap="round"/>
  <g transform="rotate(90 98 118)"><!-- head -->
  <circle cx="104" cy="112" r="50" fill="url(#hair)"/>
  <circle cx="96" cy="122" r="46" fill="url(#skin)"/>
  <ellipse cx="62" cy="140" rx="9" ry="6" fill="#F59C8B" opacity=".7"/>
  <path d="M58 88 C64 80 74 78 82 82" stroke="#4A2C1F" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M92 86 C98 88 106 88 112 86" stroke="#4A2C1F" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- mask strap -->
  <path d="M118 112 C132 108 146 104 154 100" stroke="#24344F" stroke-width="10" stroke-linecap="round"/>
  <!-- mask -->
  <rect x="48" y="94" width="76" height="44" rx="18" fill="url(#glass)" stroke="#F2683F" stroke-width="8"/>
  <g id="eyes"><circle cx="70" cy="117" r="9" fill="#FFFFFF"/><circle cx="100" cy="116" r="11" fill="#FFFFFF"/>
  <circle cx="68" cy="118" r="5.5" fill="#24344F"/><circle cx="98" cy="117" r="6.5" fill="#24344F"/>
  <circle cx="69.5" cy="116" r="1.8" fill="#FFFFFF"/><circle cx="99.5" cy="115" r="2" fill="#FFFFFF"/></g>
  <g id="lids" opacity="0"><rect x="58" y="104" width="24" height="16" rx="6" fill="#BFE6F5"/><rect x="86" y="102" width="28" height="18" rx="6" fill="#BFE6F5"/></g>
  <path d="M60 104 L70 100" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- smile + mouthpiece -->
  <ellipse cx="84" cy="153" rx="7" ry="8" fill="#7A2E22"/><ellipse cx="84" cy="156" rx="4" ry="3" fill="#E86A5C"/>
  </g></svg>
