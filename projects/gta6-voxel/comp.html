// ── captions (word by word, RTL, stacked) ──
const EMPH = { l1: [3, 4], l2: [2, 3, 4, 5], l3: [0, 2], l4: [4, 5], l5: [1, 2], l6: [0, 1, 2], l7: [4] };   // word indices drawn big
const COL = { l1: '#ff3d8b', l2: '#2ef2e2', l3: '#ff3d8b', l4: '#ffb02e', l5: '#2ef2e2', l6: '#2ef2e2', l7: '#ff3d8b' };
function captionWords(id) { const w = VO.words[id]; if (w && w.length) return w; // fallback: spread the line's words evenly
  const txt = { l1: 'الكل قاعد يسأل نفس السؤال.', l2: 'متى بينزل جي تي أي سِكس؟', l3: 'أجّلوه مرة، وأجّلوه مرة ثانية.', l4: 'واحنا كل يوم نطالع نفس التريلر.', l5: 'بس هالمرة؟ جهّزنا كل شي.', l6: 'القهوة، المجلس، وإجازة من الدوام.', l7: 'جي تي أي سِكس، قرّب.' }[id].split(' ');

  const rows = []; let row = [];
  ws.forEach((w, i) => { row.push([w, i]); if (row.length === 3 || EMPH[id].includes(i) && row.length >= 2) { rows.push(row); row = []; } }); if (row.length) rows.push(row);

  rows.forEach((r, ri) => {

      x -= wd + 22;

  });

}

// ── pixel dissolve (red / white / black squares cover, then clear) ──

  const u = (t - t0) / dur; if (u < -0.5 || u > 0.5) return; const cov = 1 - Math.abs(u) * 2; const cs = 80, nx = W / cs, ny = Math.ceil(H / cs), r = OM.rng(Math.round(t0 * 100));
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { const th = r(), c = r(); if (th > cov * 1.15) continue; g.fillStyle = c < 0.55 ? '#d62839' : c < 0.85 ? '#f2efe6' : '#120a18'; g.fillRect(i * cs, j * cs, cs + 1, cs + 1); }
}
// ── title at the end: scramble-decoded "GTA 6", then «قرّب» ──

  g.font = FZ(230); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillText(s, 8, 10); g.fillStyle = '#fff'; g.fillText(s, 0, 0); g.restore();
  const w2 = wordT('l7', 4, L('l7') + 1.2), k2 = spring(t - w2, 0.45, 16);

}

// ── the frame ──
let EVENTS = [];
